name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run astro -- check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify the published revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://portfolio.pdcd.net/health.json?revision=$EXPECTED_REVISION" > /tmp/portfolio-health.json && jq --exit-status --arg revision "$EXPECTED_REVISION" '.status == "ok" and .revision == $revision' /tmp/portfolio-health.json; then
              exit 0
            fi
            sleep 5
          done
          exit 1
